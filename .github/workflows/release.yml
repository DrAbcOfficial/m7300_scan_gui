name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build ARM64 application
        run: wails build -clean -platform linux/arm64 -tags webkit2_41

      - name: Package application
        run: |
          tar -C build/bin -czf pantum-scan-gui-linux-arm64.tar.gz pantum-scan-gui
          sha256sum pantum-scan-gui-linux-arm64.tar.gz > pantum-scan-gui-linux-arm64.tar.gz.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            pantum-scan-gui-linux-arm64.tar.gz \
            pantum-scan-gui-linux-arm64.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
